name: Pipeline Base - GitHub Actions

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: esteira-devsecops-open-source

jobs:
  checkout-node:
    name: Checkout e configuração do Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar versão do Node.js e NPM
        run: |
          node --version
          npm --version

      - name: Listar arquivos do projeto
        run: ls -la

      - name: Instalar dependências
        run: npm install

      - name: Executar lint
        run: npm run lint

  # [PBI-11 - Recuperado] Job do Semgrep mantido com a severidade corrigida
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    needs: checkout-node
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Executar Semgrep Scan
        run: semgrep scan --severity=ERROR --json --output=semgrep-results.json

  # [PBI-16 / TASK 80] Novo Job para analisar vulnerabilidades em arquivos locais (SCA)
  trivy-fs:
    name: Trivy - Scan de Sistema de Arquivos (FS)
    runs-on: ubuntu-latest
    needs: checkout-node
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Executar Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL' # [PBI-16 / TASK 81] Filtra apenas vulnerabilidades graves

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    # O Build agora cria uma barreira tripla: depende do checkout, do Semgrep e do Trivy FS passar!
    needs: [checkout-node, semgrep, trivy-fs]

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar existência do Dockerfile
        run: |
          test -f Dockerfile
          echo "Dockerfile encontrado com sucesso."

      - name: Padronizar nome da imagem Docker
        run: |
          echo "Nome da imagem: $IMAGE_NAME"
          echo "Tag do commit: ${{ github.sha }}"

      - name: Construir imagem Docker
        run: |
          docker build \
            --file Dockerfile \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            .

      - name: Validar imagem Docker gerada
        run: |
          docker images | grep $IMAGE_NAME
          echo "Imagem Docker gerada com sucesso."

  # [PBI-16 / TASK 80] Novo Job para analisar vulnerabilidades dentro do container pronto
  trivy-image:
    name: Trivy - Scan da Imagem Docker
    runs-on: ubuntu-latest
    needs: docker-build # Só executa após a imagem ser gerada com sucesso no job anterior
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # Como o ambiente do GitHub é efêmero, recriamos a imagem localmente neste container de análise
      - name: Construir imagem Docker para Análise
        run: |
          docker build \
            --file Dockerfile \
            --tag $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Executar Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          scan-type: 'image'
          severity: 'HIGH,CRITICAL' # [PBI-16 / TASK 81] Filtra apenas vulnerabilidades graves