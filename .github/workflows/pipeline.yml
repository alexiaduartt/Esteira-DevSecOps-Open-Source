name: Pipeline Base - GitHub Actions

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: esteira-devsecops-open-source
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checkout-node:
    name: Checkout e configuração do Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: npm install
      - name: Executar lint
        run: npm run lint

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    needs: checkout-node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar pasta de relatório do Gitleaks
        run: mkdir -p reports/gitleaks
      - name: Executar Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: >-
            detect
            --source=/github/workspace
            --config=/github/workspace/security/gitleaks/.gitleaks.toml
            --report-format=json
            --report-path=/github/workspace/reports/gitleaks/gitleaks-results.json
            --exit-code=1
            --redact
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/gitleaks/gitleaks-results.json

  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    needs: checkout-node
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Criar pasta de relatório do Semgrep
        run: mkdir -p reports/semgrep
      - name: Semgrep Scan
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "security/semgrep/rules.yaml" \
            --severity=ERROR \
            --error \
            --json \
            --output=reports/semgrep/semgrep-results.json
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep/semgrep-results.json

  # [PBI-16 / TASK 80] Novo job para escanear dependências do projeto (npm)
  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    needs: checkout-node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Criar pasta de relatório do Trivy FS
        run: mkdir -p reports/trivy
      - name: Executar Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "reports/trivy/trivy-fs-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: reports/trivy/trivy-fs-results.json

  validate-reports:
    name: Validar Relatórios de Segurança
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, trivy-fs]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Gitleaks Report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks/
      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep/
      - name: Download Trivy FS Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: reports/trivy/
      - name: Validar integridade dos relatórios
        run: |
          chmod +x scripts/validate-reports.sh
          bash scripts/validate-reports.sh

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, trivy-fs, validate-reports]
    if: success()
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar existência do Dockerfile
        run: |
          test -f Dockerfile
          echo "Dockerfile encontrado com sucesso."

      - name: Padronizar nome da imagem Docker
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Nome da imagem: $IMAGE_NAME"
          echo "Tag do commit: $IMAGE_TAG"

      - name: Construir imagem Docker
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --file Dockerfile \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --tag "$IMAGE_NAME:latest" \
            .

      - name: Validar imagem Docker gerada
        run: |
          docker images | grep $IMAGE_NAME
          echo "Imagem Docker gerada com sucesso."

      - name: Criar diretório para SBOM
        run: mkdir -p reports/trivy/sbom

      - name: Gerar SBOM da imagem Docker com Trivy
        uses: aquasecurity/trivy-action@0.35.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "cyclonedx"
          output: "reports/trivy/sbom/sbom-cyclonedx.json"

      - name: Validar conteúdo do SBOM
        run: |
          test -s reports/trivy/sbom/sbom-cyclonedx.json
          grep -Eq '"bomFormat"[[:space:]]*:[[:space:]]*"CycloneDX"' reports/trivy/sbom/sbom-cyclonedx.json
          grep -q '"components"' reports/trivy/sbom/sbom-cyclonedx.json
          echo "SBOM CycloneDX gerado e validado com sucesso."

      - name: Associar SBOM à imagem Docker gerada
        env:
          IMAGE_TAG: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat > reports/trivy/sbom/sbom-metadata.txt <<EOF
          Imagem Docker: $IMAGE_NAME:$IMAGE_TAG
          Imagem Docker latest: $IMAGE_NAME:latest
          Arquivo SBOM: reports/trivy/sbom/sbom-cyclonedx.json
          Formato SBOM: CycloneDX JSON
          Commit: $IMAGE_TAG
          Workflow: $WORKFLOW_NAME
          Run ID: $WORKFLOW_RUN_ID
          EOF
          cat reports/trivy/sbom/sbom-metadata.txt

      - name: Salvar SBOM como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: |
            reports/trivy/sbom/sbom-cyclonedx.json
            reports/trivy/sbom/sbom-metadata.txt
          if-no-files-found: error

  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: success()
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
      - name: Construir imagem Docker para Análise
        run: |
          docker build \
            --file Dockerfile \
            --tag $IMAGE_NAME:${{ github.sha }} \
            .
      - name: Criar pasta de relatório do Trivy Image
        run: mkdir -p reports/trivy
      - name: Executar Trivy Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          trivyignores: ".trivyignore"
          format: "json"
          output: "reports/trivy/trivy-image-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Upload Trivy Image Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: reports/trivy/trivy-image-results.json

  # [PBI-24] Estágio DAST - OWASP ZAP
  dast-zap:
    name: Executar DAST com OWASP ZAP
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir aplicação para teste
        run: docker compose up -d --build

      - name: Aguardar o healthcheck
        run: npx wait-on http://localhost:3000/health || sleep 15

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          rules_file_name: "security/zap/zap-rules.tsv"
          fail_action: false

      - name: Mover relatórios para a pasta correta
        run: |
          mkdir -p reports/zap
          mv report_html.html reports/zap/ 2>/dev/null || true
          mv report_json.json reports/zap/ 2>/dev/null || true

      - name: Upload dos Relatórios ZAP
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports
          path: reports/zap/

  dast-governance:
    name: "PBI-25: Governança DAST"
    runs-on: ubuntu-latest
    needs: dast-zap
    continue-on-error: false

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Baixar relatório do ZAP
        uses: actions/download-artifact@v4
        with:
          name: owasp-zap-reports
          path: reports/zap/

      - name: Classificar alertas DAST e gerar relatório
        run: node scripts/classify-zap-alerts.js reports/zap/report_json.json

      - name: Verificar quality gate DAST (bloqueia em alertas HIGH)
        run: node scripts/check-zap-gate.js reports/zap/report_json.json

      - name: Upload relatório de governança DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-governance-report
          path: reports/zap/zap-*-pbi25.json
          retention-days: 30

  consolidate-reports:
    name: Consolidar Relatórios SCA
    runs-on: ubuntu-latest
    needs: [trivy-fs, trivy-image]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Trivy FS Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: reports/trivy/
        continue-on-error: true
      - name: Download Trivy Image Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-report
          path: reports/trivy/
        continue-on-error: true
      - name: Gerar relatório consolidado
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 scripts/consolidate-reports.py
      - name: Upload relatório consolidado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-sca-report
          path: |
            reports/trivy/consolidated-report.json
            reports/trivy/defectdojo-import.sh
          if-no-files-found: error
# PBI-26 + PBI-28: Coleta os artefatos e relatórios de segurança gerados pelas
# ferramentas SCA, SAST, Secret e DAST, valida compatibilidade e realiza
# importação organizada por ferramenta no DefectDojo.
  defectdojo-upload:
    name: "PBI-28: Importar Semgrep e GitLeaks no DefectDojo"
    runs-on: ubuntu-latest
    needs: [validate-reports, dast-governance, consolidate-reports]
    if: always()
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      # ── Coleta de artefatos por ferramenta ──
      - name: Download relatório Semgrep
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep/
        continue-on-error: true

      - name: Download relatório GitLeaks
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks/
        continue-on-error: true

      - name: Download relatório Trivy FS
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: reports/trivy/
        continue-on-error: true

      - name: Download relatório Trivy Image
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-report
          path: reports/trivy/
        continue-on-error: true

      - name: Download relatórios OWASP ZAP
        uses: actions/download-artifact@v4
        with:
          name: owasp-zap-reports
          path: reports/zap/
        continue-on-error: true

      - name: Download relatório de governança DAST
        uses: actions/download-artifact@v4
        with:
          name: dast-governance-report
          path: reports/zap/
        continue-on-error: true

      # ── PBI-28 / Task 139: Validar compatibilidade ──
      - name: "PBI-28: Validar compatibilidade dos relatórios com DefectDojo"
        run: |
          chmod +x scripts/validate-defectdojo-compatibility.sh
          bash scripts/validate-defectdojo-compatibility.sh

      # ── PBI-28 / Task 141: Validar findings ──
      - name: "PBI-28: Validar findings Semgrep e GitLeaks"
        run: node scripts/validate-findings.js

      # ── PBI-28 / Task 140+142: Importação organizada por ferramenta ──
      - name: "PBI-28: Importar Semgrep e GitLeaks no DefectDojo"
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          ENGAGEMENT_ID: ${{ vars.DEFECTDOJO_ENGAGEMENT_ID || secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          echo "══════════════════════════════════════════════════════════════"
          echo "  PBI-28 │ Upload para DefectDojo (organizado por ferramenta)"
          echo "══════════════════════════════════════════════════════════════"

          if [ -z "$DEFECTDOJO_URL" ] || [ -z "$DEFECTDOJO_TOKEN" ] || [ -z "$ENGAGEMENT_ID" ]; then
            echo "⚠️  Credenciais DefectDojo não configuradas."
            echo "   Configure DEFECTDOJO_URL, DEFECTDOJO_TOKEN e DEFECTDOJO_ENGAGEMENT_ID"
            echo "   nas variáveis/secrets do repositório para ativar a importação real."
            echo ""
            echo "── Simulação de importação por ferramenta ──"
            echo "  1. [SAST]   Semgrep  → scan_type: Semgrep JSON Report  ✅ Mapeado"
            echo "  2. [Secret] GitLeaks → scan_type: Gitleaks Scan        ✅ Mapeado"
            echo "  3. [SCA]    Trivy FS → scan_type: Trivy Scan           ✅ Mapeado"
            echo "  4. [SCA]    Trivy Img→ scan_type: Trivy Scan           ✅ Mapeado"
            echo "  5. [DAST]   ZAP      → scan_type: ZAP Scan            ✅ Mapeado"
            echo "══════════════════════════════════════════════════════════════"
            exit 0
          fi

          chmod +x scripts/import-semgrep-gitleaks-defectdojo.sh
          bash scripts/import-semgrep-gitleaks-defectdojo.sh

      # ── Upload dos relatórios de validação como artefatos ──
      - name: Upload relatórios de validação PBI-28
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectdojo-validation-reports
          path: reports/defectdojo/
          retention-days: 30
