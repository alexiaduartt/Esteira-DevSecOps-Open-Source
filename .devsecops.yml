# =============================================================================
# .devsecops.yml — Configuração central da esteira DevSecOps
# =============================================================================
# Este arquivo documenta os parâmetros configuráveis da esteira.
# As variáveis reais são definidas no bloco 'env' do pipeline.yml.
# Para adaptar a esteira a outro projeto, altere os valores abaixo e
# replique-os no workflow do GitHub Actions.
# =============================================================================

# --- Aplicação ---
app:
  port: 3000
  health_endpoint: "/health"
  runtime: "node"
  runtime_version: "20"
  dockerfile: "Dockerfile"
  docker_compose: "docker-compose.yml"

# --- Segurança ---
security:
  # Trivy — SCA (Software Composition Analysis)
  trivy:
    severity: "HIGH,CRITICAL"
    ignore_file: ".trivyignore"

  # Semgrep — SAST (Static Application Security Testing)
  semgrep:
    severity: "ERROR"
    configs:
      - "p/owasp-top-ten"
      - "p/nodejs"
      - "security/semgrep/rules.yaml"
    ignore_file: ".semgrepignore"

  # Gitleaks — Secret Scanning
  gitleaks:
    config: "security/gitleaks/.gitleaks.toml"
    exit_code: 1

  # OWASP ZAP — DAST (Dynamic Application Security Testing)
  zap:
    target: "http://localhost:3000"
    rules_file: "security/zap/zap-rules.tsv"
    fail_action: false

# --- Quality Gates ---
quality_gates:
  block_on_severity:
    - "HIGH"
    - "CRITICAL"
  block_on_secrets: true
  policy_file: "security/policies/dependency-severity-policy.md"

# --- Integração DefectDojo ---
defectdojo:
  # Variáveis de ambiente necessárias (configurar como secrets no GitHub):
  #   DEFECTDOJO_URL — URL base da instância
  #   DEFECTDOJO_TOKEN — Token da API
  #   DEFECTDOJO_ENGAGEMENT_ID — ID do engagement
  scan_types:
    semgrep: "Semgrep JSON Report"
    gitleaks: "Gitleaks Scan"
    trivy: "Trivy Scan"
    cyclonedx: "CycloneDX Scan"
    zap: "ZAP Scan"

# --- Relatórios ---
reports:
  output_dir: "reports"
  nomenclature: "[FERRAMENTA]-[DATA]-[VERSÃO/PBI].[EXTENSÃO]"
  retention_days: 30

# --- Notificações (configurar webhooks como secrets) ---
notifications:
  on_failure: true
  channels:
    # slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
    # discord_webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
