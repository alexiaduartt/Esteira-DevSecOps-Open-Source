# =============================================================================
# Docker Compose — DefectDojo (Gestão de Vulnerabilidades)
# =============================================================================
# Uso:
#   docker compose -f docker-compose.defectdojo.yml up -d
#
# Acesso:
#   http://localhost:8080
#   Usuário padrão: admin
#   Senha inicial: ver logs do container com:
#     docker compose -f docker-compose.defectdojo.yml logs initializer | grep "Admin password"
#
# Após subir, configure no GitHub:
#   vars.DEFECTDOJO_URL = http://localhost:8080
#   secrets.DEFECTDOJO_TOKEN = <token gerado na interface>
#   vars.DEFECTDOJO_ENGAGEMENT_ID = <id do engagement criado>
# =============================================================================

services:
  nginx:
    image: defectdojo/defectdojo-nginx:latest
    depends_on:
      - uwsgi
    ports:
      - "8080:8080"
    environment:
      NGINX_METRICS_ENABLED: "false"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media

  uwsgi:
    image: defectdojo/defectdojo-django:latest
    depends_on:
      - postgres
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-uwsgi.sh"]
    environment:
      DD_DATABASE_ENGINE: django.db.backends.postgresql
      DD_DATABASE_HOST: postgres
      DD_DATABASE_PORT: "5432"
      DD_DATABASE_NAME: defectdojo
      DD_DATABASE_USER: defectdojo
      DD_DATABASE_PASSWORD: defectdojo
      DD_SECRET_KEY: "change-me-in-production-please"
      DD_CREDENTIAL_AES_256_KEY: "change-me-too"
      DD_ALLOWED_HOSTS: "*"
    volumes:
      - defectdojo_media:/app/media

  celerybeat:
    image: defectdojo/defectdojo-django:latest
    depends_on:
      - postgres
      - redis
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-beat.sh"]
    environment:
      DD_DATABASE_ENGINE: django.db.backends.postgresql
      DD_DATABASE_HOST: postgres
      DD_DATABASE_PORT: "5432"
      DD_DATABASE_NAME: defectdojo
      DD_DATABASE_USER: defectdojo
      DD_DATABASE_PASSWORD: defectdojo
      DD_SECRET_KEY: "change-me-in-production-please"
      DD_CREDENTIAL_AES_256_KEY: "change-me-too"

  celeryworker:
    image: defectdojo/defectdojo-django:latest
    depends_on:
      - postgres
      - redis
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-worker.sh"]
    environment:
      DD_DATABASE_ENGINE: django.db.backends.postgresql
      DD_DATABASE_HOST: postgres
      DD_DATABASE_PORT: "5432"
      DD_DATABASE_NAME: defectdojo
      DD_DATABASE_USER: defectdojo
      DD_DATABASE_PASSWORD: defectdojo
      DD_SECRET_KEY: "change-me-in-production-please"
      DD_CREDENTIAL_AES_256_KEY: "change-me-too"

  initializer:
    image: defectdojo/defectdojo-django:latest
    depends_on:
      - postgres
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-initializer.sh"]
    environment:
      DD_DATABASE_ENGINE: django.db.backends.postgresql
      DD_DATABASE_HOST: postgres
      DD_DATABASE_PORT: "5432"
      DD_DATABASE_NAME: defectdojo
      DD_DATABASE_USER: defectdojo
      DD_DATABASE_PASSWORD: defectdojo
      DD_SECRET_KEY: "change-me-in-production-please"
      DD_CREDENTIAL_AES_256_KEY: "change-me-too"
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: admin
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: DefectDojo

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  defectdojo_postgres:
  defectdojo_media:
